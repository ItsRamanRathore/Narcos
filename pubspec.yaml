  pointycastle: ^4.0.0
  crypto: ^3.0.7
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  safe_device: ^1.1.4
  local_auth: ^3.0.2
  device_info_plus: any
  uuid: ^4.6.0
  go_router: ^18.0.1
